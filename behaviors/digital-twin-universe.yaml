bundle:
  name: digital-twin-universe-behavior
  version: 0.1.0
  description: Adds digital twin environment capability via the amplifier-digital-twin CLI

includes:
  - bundle: git+https://github.com/microsoft/amplifier-bundle-gitea@main

agents:
  include:
    - digital-twin-universe:dtu-profile-builder

tools:
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-module-tool-skills@main
    config:
      skills:
        - "git+https://github.com/microsoft/amplifier-bundle-digital-twin-universe@main#subdirectory=skills"

context:
  include:
    - digital-twin-universe:context/dtu-awareness.md
