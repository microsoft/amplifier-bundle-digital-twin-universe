# OpenAI Codex CLI - AI coding agent TUI
# Installs the published @openai/codex npm package in an isolated container.
name: openai-codex-cli
description: >
  OpenAI Codex CLI coding agent in an isolated Ubuntu 24.04 container
base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: openai
      key_env: OPENAI_API_KEY

provision:
  setup_cmds:
    # System dependencies (matching upstream Dockerfile recommendations)
    - apt-get update && apt-get install -y --no-install-recommends
        ca-certificates
        curl
        git
        jq
        ripgrep
        procps
        less
        unzip
        gnupg2
      && rm -rf /var/lib/apt/lists/*

    # Install Node.js 22 LTS via NodeSource
    - |
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      apt-get install -y nodejs
      rm -rf /var/lib/apt/lists/*

    - npm install -g @openai/codex

    # Configure codex for an isolated container: disable the
    # bubblewrap filesystem sandbox and the approval gate. 
    # `sandbox_mode = "danger-full-access"`
    # is the real switch that maps to SandboxType::None, leaving codex to
    # run commands in the host mount namespace with full read/write access.
    # `approval_policy = "never"` keeps `codex exec` non-interactive.
    - |
      mkdir -p /root/.codex
      cat > /root/.codex/config.toml << 'EOF'
      sandbox_mode = "danger-full-access"
      approval_policy = "never"
      EOF

    # Persist the API key into codex's own credential store. Without this,
    # codex picks up OPENAI_API_KEY but does not authenticate properly
    # against the Responses websocket endpoint, leading to 401 errors.
    # `codex login --with-api-key` reads the key from stdin and writes it
    # to /root/.codex/auth.json, which codex prefers for all auth paths.
    - printenv OPENAI_API_KEY | codex login --with-api-key

    # Verify installation and auth
    - codex --help | head -5
    - codex login status

    # Create a workspace for the user
    - mkdir -p /home/user/project

readiness:
  - name: codex-installed
    command: "CODEX_UNSAFE_ALLOW_NO_SANDBOX=1 codex --help"
